<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Brand Glow Gradient -->
    <linearGradient id="qorevixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9AFF" />
      <stop offset="50%" stop-color="#2D7EFF" />
      <stop offset="100%" stop-color="#9F7AFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- DISINTEGRATING NEURAL DATA PARTICLES (TOP LEFT OF Q) -->
    <g fill="url(#qorevixGrad)" opacity="0.9">
      <rect x="75" y="62" width="7" height="7" rx="1.5" />
      <rect x="90" y="50" width="9" height="9" rx="1.5" />
      <rect x="105" y="42" width="11" height="11" rx="2" />
      <rect x="122" y="65" width="8" height="8" rx="1.5" />
      <rect x="135" y="55" width="10" height="10" rx="2" />
      <circle cx="68" cy="65" r="4" />
      <circle cx="82" cy="85" r="3.5" />
      <circle cx="98" cy="98" r="4.5" />
      <circle cx="55" cy="78" r="3" />
      <rect x="108" y="78" width="9" height="9" rx="1.5" />
      <rect x="120" y="90" width="11" height="11" rx="2" />
      <rect x="134" y="105" width="8" height="8" rx="1.5" />
    </g>

    <!-- MAIN 'Q' ICON WITH BREAKAWAY CURVE -->
    <!-- Outer Ring -->
    <path
      d="M 200 75 A 70 70 0 1 1 128 175"
      stroke="url(#qorevixGrad)"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Inner Ring -->
    <path
      d="M 195 88 A 56 56 0 1 1 138 165"
      stroke="url(#qorevixGrad)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.75"
      fill="none"
    />
    <!-- Q Tail / Slash -->
    <path
      d="M 160 145 L 235 205 L 290 205 L 205 140 Z"
      fill="url(#qorevixGrad)"
      stroke="url(#qorevixGrad)"
      stroke-width="2"
    />

    <!-- 'OREVI' FUTURISTIC GEOMETRIC TYPOGRAPHY -->
    <g stroke="url(#qorevixGrad)" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <!-- O -->
      <rect x="305" y="112" width="55" height="48" rx="14" />
      
      <!-- R -->
      <path d="M 380 160 L 380 112 L 418 112 C 430 112 436 118 436 127 C 436 136 430 141 418 141 L 380 141 M 412 141 L 436 160" />

      <!-- E -->
      <path d="M 455 160 L 455 112 L 505 112 M 455 136 L 495 136 M 455 160 L 505 160" />

      <!-- V -->
      <path d="M 520 112 L 548 160 L 576 112" />

      <!-- I -->
      <path d="M 595 112 L 595 160" />
    </g>

    <!-- FUTURISTIC ACCENT 'X' FLOURISH -->
    <g stroke="url(#qorevixGrad)" stroke-width="4.5" stroke-linecap="round">
      <path d="M 610 185 L 750 85" />
      <path d="M 615 90 L 740 180" />
      <path d="M 675 135 L 755 60" opacity="0.8" />
      <path d="M 675 135 L 745 205" opacity="0.8" />
    </g>

    <!-- UNDERLINE & SUB-TITLE 'TECHNOLOGIES' -->
    <!-- Underline bar -->
    <path d="M 285 174 L 610 174" stroke="url(#qorevixGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- TECHNOLOGIES text -->
    <text
      x="288"
      y="202"
      fill="#EEEEF5"
      font-family="Syne, sans-serif"
      font-weight="700"
      font-size="20"
      letter-spacing="14"
    >
      TECHNOLOGIES
    </text>
  </g>
</svg>
